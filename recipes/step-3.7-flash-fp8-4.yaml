# Recipe: Step-3.7-Flash-FP8
# Step 3.7 Flash model with FP8 quantization (2+ sparks only) - use with --no-ray only!

recipe_version: "1"
name: Step-3.7-Flash-FP8-MTP
description: vLLM serving Step-3.7-Flash-FP8 on four Sparks (use with --no-ray)

# HuggingFace model to download (optional, for --download-model)
model: stepfun-ai/Step-3.7-Flash-FP8

# Container image to use
container: vllm-node

# Can only be run in a cluster
cluster_only: true

# No mods required
mods:
  - mods/step-3.7-flash
  - mods/gpu-mem-util-gb
  - mods/drop-caches

# Default settings (can be overridden via CLI)
defaults:
  port: 30000
  host: 0.0.0.0
  tensor_parallel: 4
  gpu_memory_utilization: 100
  max_model_len: 262144
  max_num_seqs: 4
  max_num_batched_tokens: 16384
  max_cudagraph_capture_size: 512
  dtype: bfloat16
  kv_cache_dtype: fp8
  moe_backend: auto
  linear_backend: flashinfer_cutlass
  attention_backend: flashinfer
  gdn_prefill_backend: cutedsl

# Environment variables
env:
  NCCL_DEBUG_SUBSYS: INIT,ENV,NET,GRAPH
  VLLM_FLOAT32_MATMUL_PRECISION: high 
  TORCH_MATMUL_PRECISION: high
  OMP_NUM_THREADS: 10 
  MKL_NUM_THREADS: 10 
  CUTE_DSL_ARCH: sm_121a 
  TORCH_CUDA_ARCH_LIST: 12.1a
  FLASHINFER_CUDA_ARCH_LIST: 12.1a

# The vLLM serve command template
command: |
  vllm serve stepfun-ai/Step-3.7-Flash-FP8 \
      --trust-remote-code \
      --cudagraph-metrics --enable-mfu-metrics \
      --port {port} \
      --host {host} \
      --disable-cascade-attn \
      --enable-expert-parallel \
      --enable-flashinfer-autotune \
      --gpu-memory-utilization-gb {gpu_memory_utilization} \
      -tp {tensor_parallel} \
      --max-model-len {max_model_len} \
      --enable-auto-tool-choice \
      --reasoning-parser step3p5 \
      --tool-call-parser step3p5 \
      --load-format safetensors \
      --dtype {dtype} \
      --kv-cache-dtype {kv_cache_dtype} \
      --moe-backend {moe_backend} \
      --linear-backend {linear_backend} \
      --attention-backend {attention_backend} \
      --gdn-prefill-backend {gdn_prefill_backend} \
      --speculative_config '{{"method": "mtp", "num_speculative_tokens": 3}}' \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --max-cudagraph-capture-size {max_cudagraph_capture_size} \
      --max-num-seqs {max_num_seqs} \
      --expert-placement-strategy round_robin \
      --all2all-backend deepep_high_throughput

# 
