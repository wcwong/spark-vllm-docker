# Recipe: Step-3.7-Flash-NVFP4
# Step 3.7 Flash model with NVFP4 quantization (2+ sparks only)

recipe_version: "1"
name: Step-3.7-Flash-NVFP4
description: vLLM serving Step-3.7-Flash-NVFP4 on two Sparks

# HuggingFace model to download (optional, for --download-model)
model: stepfun-ai/Step-3.7-Flash-NVFP4

# Container image to use
container: vllm-node

# Can only be run in a cluster
cluster_only: true

# No mods required
mods:
  - mods/step-3.7-flash

# Default settings (can be overridden via CLI)
defaults:
  port: 30000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.8
  max_model_len: 262144
  max_num_batched_tokens: 32768
  dtype: auto
  quantization: modelopt_fp4
  moe_backend: cutlass
  linear_backend: flashinfer_cutlass
  attention_backend: flashinfer
#  attention_backend: flash_attn
  gdn_prefill_backend: cutedsl


# Environment variables
env:
  NCCL_DEBUG_SUBSYS: INIT,ENV,NET,GRAPH
  VLLM_FLOAT32_MATMUL_PRECISION: high 
  TORCH_MATMUL_PRECISION: high
  OMP_NUM_THREADS: 10 
  MKL_NUM_THREADS: 10 
  CUTE_DSL_ARCH: sm_121a 

# The vLLM serve command template
command: |
  vllm serve stepfun-ai/Step-3.7-Flash-NVFP4 \
      --trust-remote-code \
      --cudagraph-metrics --enable-mfu-metrics \
      --port {port} \
      --host {host} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      -tp {tensor_parallel} \
      --dtype {dtype} \
      --max-model-len {max_model_len} \
      --enable-auto-tool-choice \
      --reasoning-parser step3p5 \
      --tool-call-parser step3p5 \
      --load-format instanttensor \
      --quantization {quantization} \
      --linear-backend {linear_backend} \
      --attention-backend {attention_backend} \
      --gdn-prefill-backend {gdn_prefill_backend} \
      --moe-backend {moe_backend}


#   linear_backend: flashinfer-b12x
#  gdn_prefill_backend: flashinfer

