# Recipe: Step-3.7-Flash-NVFP4
# Step 3.7 Flash model with NVFP4 quantization (2+ sparks only)

recipe_version: "1"
name: Step-3.7-Flash-NVFP4
description: vLLM serving Step-3.7-Flash-NVFP4 on two Sparks

model: stepfun-ai/Step-3.7-Flash-NVFP4

container: vllm-node

cluster_only: true

mods:
  - mods/step-3.7-flash
  - mods/drop-caches

# Default settings (can be overridden via CLI)
defaults:
  port: 30000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.9
  max_model_len: 262144
  max_num_batched_tokens: 32768
  max_num_seqs: 4
  dtype: bfloat16
  quantization: modelopt_fp4
  moe_backend: auto
  linear_backend: flashinfer_cutlass
  attention_backend: flashinfer
  gdn_prefill_backend: cutedsl

# still doesn't work
#   linear_backend: flashinfer-b12x
  
env:
  NCCL_DEBUG_SUBSYS: INIT,ENV,NET,GRAPH
  VLLM_FLOAT32_MATMUL_PRECISION: high 
  TORCH_MATMUL_PRECISION: high
  OMP_NUM_THREADS: 10 
  MKL_NUM_THREADS: 10 
  CUTE_DSL_ARCH: sm_121a 


# try these out at some point
#  TORCH_CUDA_ARCH_LIST: 12.1a
#  FLASHINFER_CUDA_ARCH_LIST: 12.1a


command: |
  vllm serve stepfun-ai/Step-3.7-Flash-NVFP4 \
      --trust-remote-code \
      --disable-cascade-attn \
      --enable-expert-parallel \
      --cudagraph-metrics --enable-mfu-metrics \
      --port {port} \
      --host {host} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      -tp {tensor_parallel} \
      --dtype {dtype} \
      --max-model-len {max_model_len} \
      --enable-chunked-prefill \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --max-num-seqs {max_num_seqs} \
      --enable-auto-tool-choice \
      --reasoning-parser step3p5 \
      --tool-call-parser step3p5 \
      --load-format instanttensor \
      --quantization {quantization} \
      --enable-flashinfer-autotune \
      --linear-backend {linear_backend} \
      --attention-backend {attention_backend} \
      --gdn-prefill-backend {gdn_prefill_backend} \
      --moe-backend {moe_backend}
