 # Recipe: Nemotron-3-Super-NVFP4
recipe_version: "1"
name: Nemotron-3-Super-NVFP4-b12x 
description: vLLM serving Nemotron-3-Super-120B using b12x

# https://github.com/NVIDIA-NeMo/Nemotron/blob/main/usage-cookbook/Nemotron-3-Super/SparkDeploymentGuide/README.md#config--nvfp4-1-dgx-spark

model: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4
container: vllm-node

# for the reasoning parser.

mods: 
  - mods/nemotron-super

env:
  VLLM_FLASHINFER_ALLREDUCE_BACKEND: trtllm
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: 1
  VLLM_FLOAT32_MATMUL_PRECISION: high 
  OMP_NUM_THREADS: 10 
  MKL_NUM_THREADS: 10 

container: vllm-node

defaults:
  port: 30000
  host: 0.0.0.0
  gpu_memory_utilization: 0.75
  max_model_len: 262144
  max_num_seqs: 4
  moe_backend: flashinfer_cutlass
  linear_backend: flashinfer-cutlass
  quantization: modelopt_nvfp4
  attention_backend: FLASHINFER

command: |
  vllm serve nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4 \
    --served-model-name nemotron-3-super \
    --host {host} --port {port} \
    --dtype bfloat16 \
    --disable-cascade-attn \
    --kv-cache-dtype auto \
    --load-format fastsafetensors \
    --trust-remote-code \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-chunked-prefill \
    --max-num-seqs {max_num_seqs} \
    --max-model-len {max_model_len} \
    --moe-backend {moe_backend} \
    --mamba_ssm_cache_dtype float32 \
    --quantization {quantization} \
    --attention-backend {attention_backend} \
    --linear-backend {linear_backend} \
    --max_num_batched_tokens=16384 \
    --speculative_config '{{"method":"mtp","num_speculative_tokens":3,"moe_backend":"triton"}}' \
    --reasoning-parser-plugin /workspace/vllm/super_v3_reasoning_parser.py \
    --reasoning-parser super_v3 \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder

