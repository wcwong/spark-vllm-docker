# Recipe: Nemotron-3-Super-NVFP4
recipe_version: "1"
name: Nemotron-3-Super-NVFP4-b12x 
description: vLLM serving Nemotron-3-Super-120B using b12x

# https://github.com/NVIDIA-NeMo/Nemotron/blob/main/usage-cookbook/Nemotron-3-Super/SparkDeploymentGuide/README.md#config--nvfp4-1-dgx-spark

model: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4
container: vllm-node
cluster_only: false
solo_only: false

# for the reasoning parser.

mods: 
  - mods/nemotron-super

env:
  VLLM_FLASHINFER_ALLREDUCE_BACKEND: trtllm
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: 1
  VLLM_USE_FLASHINFER_MOE_FP4: 1
  VLLM_NVFP4_GEMM_BACKEND: flashinfer-cutlass

container: vllm-node

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.90
  max_model_len: 1000000
  max_num_seqs: 4
  moe_backend: flashinfer-cutlass
  quantization: modelopt_fp4
  attention_backend: TRITON_ATTN

command: |
  vllm serve nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4 \
    --served-model-name nemotron-3-super \
    --host {host} \
    --port {port} \
    --async-scheduling \
    --dtype auto \
    --kv-cache-dtype fp8 \
    --tensor-parallel-size {tensor_parallel} \
    --pipeline-parallel-size 1 \
    --data-parallel-size 1 \
    --trust-remote-code \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-chunked-prefill \
    --max-num-seqs {max_num_seqs} \
    --max-model-len {max_model_len} \
    --moe-backend {moe_backend} \
    --mamba_ssm_cache_dtype float32 \
    --quantization {quantization} \
    --attention-backend {attention_backend} \
    --speculative_config '{{"method":"mtp","num_speculative_tokens":3,"moe_backend":"triton"}}' \
    --reasoning-parser-plugin super_v3_reasoning_parser.py \
    --reasoning-parser super_v3 \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder

